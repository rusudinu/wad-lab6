<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Search Studio</title>
		<link rel="stylesheet" href="/css/app.css" />
	</head>
	<body>
		<div class="ambient">
			<span class="orb orb-a"></span>
			<span class="orb orb-b"></span>
			<span class="orb orb-c"></span>
		</div>

		<main class="page">
			<header class="hero">
				<h1>Postgres and Elasticsearch side by side.</h1>
				<form class="search-bar" role="search" id="search-form">
					<input
						type="search"
						name="q"
						id="search-input"
						placeholder="Search for a title, tag, or phrase"
						autocomplete="off"
					/>
					<button type="submit">Search</button>
				</form>
			</header>

			<section class="grid">
				<article class="panel">
					<div class="panel-head">
						<h2>Postgres Search</h2>
						<span class="chip">Relational</span>
					</div>
					<div class="panel-meta">
						<span class="metric" data-role="postgres-time">-- ms</span>
						<span class="metric" data-role="postgres-count">0 results</span>
					</div>
					<ul class="results" data-role="postgres-results">
						<li class="empty">No results yet.</li>
					</ul>
				</article>

				<article class="panel">
					<div class="panel-head">
						<h2>Elasticsearch Search</h2>
						<span class="chip">Relevance</span>
					</div>
					<div class="panel-meta">
						<span class="metric" data-role="elasticsearch-time">-- ms</span>
						<span class="metric" data-role="elasticsearch-count">0 results</span>
					</div>
					<ul class="results" data-role="elasticsearch-results">
						<li class="empty">No results yet.</li>
					</ul>
				</article>
			</section>
		</main>

		<script src="/js/search.js" defer></script>
	</body>
</html>
